# Local stack: docker compose up --build, then open http://localhost:3000.
# Clean by default; set DEKU_SEED_DEMO=true for the demo accounts.
# Defaults match .env.example and are for local development only.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deku
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      # TCP check: the image's init-time server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d deku"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-dev-only-postgres-password}@postgres:5432/deku
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:-dev-only-authenticator-password}
      DEKU_SEED_DEMO: ${DEKU_SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgrest:
    image: postgrest/postgrest:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:-dev-only-authenticator-password}@postgres:5432/deku
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      PGRST_JWT_AUD: deku
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      POSTGREST_URL: http://postgrest:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      # No scheduler locally; generate notifications by hand:
      # curl -X POST -H "X-Deku-Cron-Secret: dev-only-cron-secret" http://localhost:8080/api/v1/internal/notifications/generate
      CRON_SECRET: ${CRON_SECRET:-dev-only-cron-secret}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-ZGV2LW9ubHktZGF0YS1lbmNyeXB0aW9uLWtleS0zMmI=}
      # Empty = online payments off. See backend/.env.example.
      RAZORPAY_CLIENT_ID: ${RAZORPAY_CLIENT_ID:-}
      RAZORPAY_CLIENT_SECRET: ${RAZORPAY_CLIENT_SECRET:-}
      RAZORPAY_REDIRECT_URI: ${RAZORPAY_REDIRECT_URI:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Off unless set; GSP_PROVIDER=sandbox / KYC_PROVIDER=sandbox for a labelled local demo.
      GSP_PROVIDER: ${GSP_PROVIDER:-}
      KYC_PROVIDER: ${KYC_PROVIDER:-}
      DEKU_ENV: ${DEKU_ENV:-development}
      # Only this address may become the first administrator. Empty locally = whoever signs up first.
      DEKU_ADMIN_EMAIL: ${DEKU_ADMIN_EMAIL:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # /ready also checks the backend can reach PostgREST.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      - postgrest

  frontend:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      # Turns the demo sign-in on, for the accounts migrate seeds with the same setting.
      DEKU_SEED_DEMO: ${DEKU_SEED_DEMO:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
